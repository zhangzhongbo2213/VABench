*{box-sizing:border-box}body{margin:0;background:#fff;color:#18233b;font-family:Arial,sans-serif}

.stage svg{display:block;width:100%;height:auto}.model-tabs{position:absolute;left:4.4%;right:5.5%;bottom:2.3%;display:flex;gap:1.45%;height:5.8%;min-height:24px}

.model-tab:focus-visible{outline:2px solid #6952b7;outline-offset:3px;border-radius:4px}
.model-tab::after{content:attr(data-label);position:absolute;bottom:85%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;line-height:1.4;background:#18233b;color:white;padding:6px 9px;border-radius:6px;opacity:0;pointer-events:none;z-index:2}

.controls{display:flex;justify-content:center;align-items:center;gap:15px;padding:12px 16px 0;min-height:57px}
.toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #ccd4e2;border-radius:9px;background:#f2f4f8;color:#26334c;min-width:108px;min-height:42px;padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}

.selection{font-size:13px;font-weight:600;min-width:130px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  const models = data.models;
  const root = document.querySelector('.player');
  const tabs = document.querySelector('.model-tabs');
  const toggle = document.querySelector('.toggle');
  const polygon = document.getElementById('profile-polygon');
  const points = Array.from({length:9}, (_, i) => document.getElementById('point-'+i));
  const hold = 1400, transition = 900, period = hold + transition, total = period * models.length;
  let elapsed = 0, playing = true, selected = -1, last = performance.now(), request = 0;
  const rgb = hex => hex.match(/[a-f\d]{2}/gi).map(value => parseInt(value,16));
  const blend = (a,b,mix) => 'rgb('+rgb(a).map((c,i)=>Math.round(c*(1-mix)+rgb(b)[i]*mix)).join(',')+')';
  const announce = message => { document.getElementById('announcement').textContent = message; };

  const buttons = models.map((model,index) => {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'model-tab';
    button.setAttribute('aria-label','Show '+model.name);
    button.setAttribute('aria-pressed','false');
    button.dataset.label = model.name;
    button.style.setProperty('--model-color',model.color);
    button.addEventListener('click',() => select(index));
    button.addEventListener('keydown',event => {
      const delta = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
      if(delta || event.key === 'Home' || event.key === 'End') {
        event.preventDefault();
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? models.length-1 : (index+delta+models.length)%models.length;
        buttons[next].focus(); select(next);
      }
    });
    tabs.append(button); return button;
  });

  function card(index) {
    if(selected === index) return;
    selected = index;
    const model = models[index];
    document.getElementById('model-index').textContent = 'MODEL '+String(index+1).padStart(2,'0')+' / 10';
    const name = document.getElementById('model-name');
    name.textContent = model.label; name.setAttribute('font-size',model.name.length>18?'14.5':'16.5');
    const success = document.getElementById('model-success');
    success.textContent = model.mean.toFixed(2)+'%'; success.setAttribute('fill',blend(model.color,'#18233b',.3));
    document.getElementById('model-logo').setAttribute('href',model.logo);
    for(let group=0;group<3;group++) {
      document.getElementById('group-values-'+group).textContent = [0,1,2].map(offset=>{
        const k=group*3+offset;return data.codes[k]+' '+model.capabilities[k].toFixed(1);
      }).join('  ·  ');
    }
    buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
    document.querySelector('.selection').textContent = String(index+1).padStart(2,'0')+' / 10 · '+model.name;
    root.dataset.model = model.name;
  }

  function render() {
    const index = Math.floor(elapsed/period)%models.length;
    const next = (index+1)%models.length;
    const mix = Math.max(0,Math.min(1,(elapsed%period-hold)/transition));
    const eased = mix*mix*(3-2*mix);
    const color = blend(models[index].color,models[next].color,eased);
    const coordinates = models[index].points.map((xy,i)=>xy.map((v,j)=>v*(1-eased)+models[next].points[i][j]*eased));
    polygon.setAttribute('points',coordinates.map(xy=>xy.join(',')).join(' '));
    polygon.setAttribute('fill',color); polygon.setAttribute('stroke',color);
    points.forEach((point,i)=>{
      point.setAttribute('cx',coordinates[i][0]);point.setAttribute('cy',coordinates[i][1]);point.setAttribute('fill',color);
    });
    card(mix<.5?index:next);
  }

  function syncControls() {
    document.getElementById('toggle-label').textContent = playing?'Pause':'Play';
    document.getElementById('toggle-icon').setAttribute('d',playing?'M3 2h4v12H3zM10 2h4v12h-4z':'M4 2l10 6-10 6z');
    toggle.setAttribute('aria-label',playing?'Pause animation':'Resume animation');
    root.dataset.playing = String(playing);
  }
  function select(index) {
    playing=false;cancelAnimationFrame(request);elapsed=index*period;render();syncControls();
    announce(models[index].name+' selected. Animation paused.');
  }
  function tick(now) {
    if(!playing) return;
    elapsed=(elapsed+Math.max(0,now-last))%total;last=now;render();request=requestAnimationFrame(tick);
  }
  toggle.addEventListener('click',()=>{
    playing=!playing;cancelAnimationFrame(request);syncControls();
    if(playing){last=performance.now();request=requestAnimationFrame(tick);}
    announce(playing?'Animation resumed.':'Animation paused.');
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) cancelAnimationFrame(request);
    else if(playing){last=performance.now();request=requestAnimationFrame(tick);}
  });
  const modelParam = new URLSearchParams(location.search).get('model');
  const initial = models.findIndex(model=>model.name===modelParam);
  if(initial>=0) elapsed=initial*period;
  render();syncControls();request=requestAnimationFrame(tick);
  if(parent!==window) {
    new ResizeObserver(()=>parent.postMessage({type:'va-bench-radar-size',height:document.body.scrollHeight},'*')).observe(document.body);
  }
})();
</script>
